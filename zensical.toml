[project]
site_name = "Besisglas Product Documentation"
site_url = "https://docs.besisglas.cc/"
site_description = "Find your Besisglas product, setup guidance and support."
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

# repo_url = "https://github.com/user/repo"
# repo_name = "user/repo"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Products" = [
    "products/index.md",
    { "Temperature & Humidity" = [
      { "TH01 · AAA" = "products/th01/index.md" },
      { "TH01 Round" = "products/th01-round/index.md" },
      { "TH01 LCD" = "products/th01-lcd/index.md" },
    ] },
    { "Soil Sensors" = [{ "STH01" = "products/sth01/index.md" }] },
    { "Presence Sensors" = [{ "MS01" = "products/ms01/index.md" }] },
    { "Door & Window Sensors" = [
      { "DS01" = "products/ds01/index.md" },
      { "DS02 · Wired contact" = "products/ds02/index.md" },
    ] },
    { "Wireless Buttons" = [{ "Zigbee Button" = "products/ts0041/index.md" }] },
    { "Water Leak Sensors" = ["products/water-leak-sensor/index.md"] },
    { "433 MHz Receivers" = ["products/433-receiver/index.md"] },
  ] },
  { "Getting Started" = [
    "getting-started/index.md",
    { "Zigbee2MQTT" = "getting-started/zigbee2mqtt.md" },
    { "Home Assistant ZHA" = "getting-started/zha.md" },
    { "Pairing & Reset" = "getting-started/pairing-reset.md" },
  ] },
  { "Troubleshooting" = "troubleshooting/index.md" },
  { "Support" = "support/index.md" },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
scheme = "default"
primary = "white"
accent = "black"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
